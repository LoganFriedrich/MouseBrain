name: mousebrain
display_name: BrainTools
contributions:
  commands:
    # === 3D Cleared Brain Pipeline ===
    - id: mousebrain.dashboard
      python_name: mousebrain.plugin_3d.pipeline_widget:PipelineDashboard
      title: Pipeline Dashboard
    - id: mousebrain.tuning
      python_name: mousebrain.plugin_3d.tuning_widget:TuningWidget
      title: Setup & Tuning
    - id: mousebrain.crop
      python_name: mousebrain.plugin_3d.manual_crop_widget:ManualCropWidget
      title: Manual Crop
    - id: mousebrain.experiments
      python_name: mousebrain.plugin_3d.experiments_widget:ExperimentsWidget
      title: Experiments
    - id: mousebrain.curation
      python_name: mousebrain.plugin_3d.curation_widget:CurationWidget
      title: Curation
    - id: mousebrain.cell_viewer_3d
      python_name: mousebrain.plugin_3d.cell_viewer_3d:Cell3DViewer
      title: 3D Cell Viewer
    # === 2D Slice Pipeline ===
    - id: mousebrain.sliceatlas
      python_name: mousebrain.plugin_2d.sliceatlas.napari_plugin.main_widget:BrainSliceWidget
      title: BrainSlice - Slice Analysis
    # === Readers ===
    - id: mousebrain.read_ims
      python_name: mousebrain.plugin_3d.ims_reader:napari_get_reader
      title: Open Imaris .ims
  readers:
    # Open any raw Imaris .ims via File > Open / drag-drop (scaled, lazy multiscale)
    - command: mousebrain.read_ims
      filename_patterns: ["*.ims"]
      accepts_directories: false
  widgets:
    # === 3D Cleared Brain Pipeline ===
    - command: mousebrain.dashboard
      display_name: "3D: 1. Pipeline Dashboard"
    - command: mousebrain.tuning
      display_name: "3D: 2. Setup & Tuning"
    - command: mousebrain.crop
      display_name: "3D: 3. Manual Crop"
    - command: mousebrain.experiments
      display_name: "3D: 4. Experiments"
    - command: mousebrain.curation
      display_name: "3D: 5. Curation"
    - command: mousebrain.cell_viewer_3d
      display_name: "3D: 6. Cell Viewer"
    # === 2D Slice Pipeline ===
    - command: mousebrain.sliceatlas
      display_name: "2D: 1. BrainSlice"

